<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCAM-BAIT login</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/dashboard/assets/app.css">
</head>
<body>
<div class="panel login">
  <h1>SCAM-BAIT dashboard</h1>
  <form method="post" action="/login">
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <input id="next" name="next" type="hidden" value="/chats">
    <button class="btn" type="submit">Log in</button>
  </form>
  <p id="err" class="err"></p>
</div>
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var n = p.get("next");
    if (n && n.charAt(0) === "/" && n.charAt(1) !== "/") { document.getElementById("next").value = n; }
    var e = p.get("error");
    var msg = e === "1" ? "Wrong password." : e === "disabled" ? "Login is disabled: DASHBOARD_PASSWORD is not set on the server." : "";
    document.getElementById("err").textContent = msg;
  })();
</script>
</body>
</html>
